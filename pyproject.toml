[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-mcp"
version = "0.1.0"
description = "MCP server for Obsidian vaults — file-based note management with SQLite indexing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["obsidian", "mcp", "notes", "markdown", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]
